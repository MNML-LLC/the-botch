version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/the-botch"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    labels:
      - "dependencies"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/client"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # ESLint 10 は eslint-plugin-react / jsx-a11y / import が未対応（Issue #114）。
      # eslint10-watch.yml の週次 probe が成功したら ignore を外してフェーズ2へ。
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
