# Vercel 本番デプロイ（GitHub連携不可のため Vercel CLI 経由）
# 必要な GitHub Secrets: VERCEL_TOKEN, DATABASE_URL
name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Vercel CLI インストール
        run: npm install -g vercel

      - name: Vercel 環境取得
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_PVayG9BHOsI1uMafQ3A1AOxi
          VERCEL_PROJECT_ID: prj_hYL6YI0OPwR5wv4VZumyYraONCHS

      - name: ビルド
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_PVayG9BHOsI1uMafQ3A1AOxi
          VERCEL_PROJECT_ID: prj_hYL6YI0OPwR5wv4VZumyYraONCHS
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 本番デプロイ
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_PVayG9BHOsI1uMafQ3A1AOxi
          VERCEL_PROJECT_ID: prj_hYL6YI0OPwR5wv4VZumyYraONCHS
