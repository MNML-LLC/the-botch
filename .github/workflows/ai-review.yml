name: AI Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Collect PR context
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p /tmp/ai-review
          gh pr diff "$PR_NUM" > /tmp/ai-review/pr-diff.txt
          DIFF_LINES=$(wc -l < /tmp/ai-review/pr-diff.txt)
          echo "diff_lines=$DIFF_LINES" >> "$GITHUB_OUTPUT"

          ISSUE_NUM=$(echo "$PR_BODY" | grep -oE "(Closes|Fixes|Resolves) #[0-9]+" | head -1 | grep -oE "[0-9]+" || true)
          if [ -n "$ISSUE_NUM" ]; then
            gh issue view "$ISSUE_NUM" --json body -q '.body' > /tmp/ai-review/issue-body.txt || echo "no issue" > /tmp/ai-review/issue-body.txt
            echo "issue_num=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          else
            echo "no linked issue" > /tmp/ai-review/issue-body.txt
          fi

          ITER_COUNT=$(gh pr view "$PR_NUM" --json comments \
            -q '[.comments[] | select(.body | startswith("## AI Review") and contains("CHANGES"))] | length')
          echo "iter_count=$ITER_COUNT" >> "$GITHUB_OUTPUT"

      - name: Skip large PRs
        if: ${{ steps.context.outputs.diff_lines > 2000 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUM" --body "## AI Review: SKIPPED
          Large PR (${{ steps.context.outputs.diff_lines }} lines > 2000). Human review recommended."
          exit 0

      - name: Skip after 3 iterations
        if: ${{ steps.context.outputs.iter_count >= 3 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUM" --body "## AI Review: STOPPED
          3 iterations reached. Awaiting CEO decision."
          exit 0

      - name: Run AI review
        id: review
        if: ${{ steps.context.outputs.diff_lines <= 2000 && steps.context.outputs.iter_count < 3 }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_TOKEN_THEBOTCH }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pip install anthropic==0.40.0 >/dev/null

          python3 <<'PY'
          import os, json, pathlib
          from anthropic import Anthropic

          pr_title = os.environ["PR_TITLE"]
          diff = pathlib.Path("/tmp/ai-review/pr-diff.txt").read_text()[:80000]
          issue_body = pathlib.Path("/tmp/ai-review/issue-body.txt").read_text()[:20000]

          client = Anthropic()
          msg = client.messages.create(
              model="claude-haiku-4-5-20251001",
              max_tokens=1500,
              messages=[{
                  "role": "user",
                  "content": f"""You are a code reviewer for the-botch (Next.js/Prisma, 6-member MNML internal app).

          PR: {pr_title}

          Linked Issue body:
          <issue>
          {issue_body}
          </issue>

          PR diff:
          <diff>
          {diff}
          </diff>

          Review criteria:
          1. Does the PR implement what the Issue requested? (all completion conditions covered)
          2. Mobile-first design principles honored (44px tap targets, semantic colors: 男気=brass/amber-700, 割り勘=blue-800)
          3. No Prisma schema changes unless explicit in Issue
          4. No obvious bugs or missing edge cases
          5. Code quality: types, no `any`, proper error handling

          Output EXACTLY one line, then details:
          APPROVE: <one-sentence summary>
          or
          CHANGES: <bullet list of specific gaps>

          Be strict — only APPROVE if you'd merge this yourself."""
              }],
          )
          verdict = msg.content[0].text.strip()
          pathlib.Path("/tmp/ai-review/verdict.txt").write_text(verdict)
          print(verdict)
          PY

      - name: Post verdict
        if: ${{ steps.context.outputs.diff_lines <= 2000 && steps.context.outputs.iter_count < 3 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          VERDICT=$(cat /tmp/ai-review/verdict.txt)
          FIRST_LINE=$(echo "$VERDICT" | head -1)

          if echo "$FIRST_LINE" | grep -q "^APPROVE"; then
            gh pr comment "$PR_NUM" --body "## AI Review: APPROVE

          $VERDICT"
            gh pr merge "$PR_NUM" --auto --squash || true
          elif echo "$FIRST_LINE" | grep -q "^CHANGES"; then
            ITER=$((${{ steps.context.outputs.iter_count }} + 1))
            gh pr comment "$PR_NUM" --body "## AI Review: CHANGES (iteration $ITER/3)

          $VERDICT

          @claude Please address the above feedback."
          else
            gh pr comment "$PR_NUM" --body "## AI Review: UNCLEAR

          $VERDICT

          Human review needed."
          fi
