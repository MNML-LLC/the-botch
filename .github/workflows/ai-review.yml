name: AI Review

# PR を自動レビューし、妥当なら auto-merge、改善点があれば @claude で iteration。
# Claude Code Action (OAuth 認証) を review モードで起動する形。

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  guard:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      iter_count: ${{ steps.check.outputs.iter_count }}
      issue_num: ${{ steps.check.outputs.issue_num }}
    steps:
      - name: Check PR size and iteration count
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          DIFF_LINES=$(gh pr diff "$PR_NUM" | wc -l)
          echo "diff_lines=$DIFF_LINES"

          ISSUE_NUM=$(echo "$PR_BODY" | grep -oE "(Closes|Fixes|Resolves) #[0-9]+" | head -1 | grep -oE "[0-9]+" || true)
          echo "issue_num=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

          ITER=$(gh pr view "$PR_NUM" --json comments \
            -q '[.comments[] | select(.body | startswith("## AI Review") and contains("CHANGES"))] | length')
          echo "iter_count=$ITER" >> "$GITHUB_OUTPUT"

          if [ "$DIFF_LINES" -gt 2000 ]; then
            gh pr comment "$PR_NUM" --body "## AI Review: SKIPPED
          Large PR ($DIFF_LINES lines > 2000). Human review recommended."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$ITER" -ge 3 ]; then
            gh pr comment "$PR_NUM" --body "## AI Review: STOPPED
          3 iterations reached. Awaiting CEO decision."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Collect context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          ISSUE_NUM: ${{ needs.guard.outputs.issue_num }}
        run: |
          mkdir -p /tmp/ai-review
          gh pr diff "$PR_NUM" > /tmp/ai-review/pr-diff.txt
          if [ -n "$ISSUE_NUM" ]; then
            gh issue view "$ISSUE_NUM" --json body -q '.body' > /tmp/ai-review/issue-body.md
          fi

      - name: Invoke Claude Code (review mode)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_THEBOTCH }}
          mode: tag
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }}: "${{ github.event.pull_request.title }}" in the-botch (Next.js/Prisma, 6-member MNML internal app).

            Load:
            - Diff: /tmp/ai-review/pr-diff.txt
            - Linked Issue body: /tmp/ai-review/issue-body.md (may be absent)

            Review criteria:
            1. Does the PR implement what the Issue requested? (all completion conditions covered)
            2. Mobile-first design principles honored (44px tap targets, semantic colors: 男気=brass/amber-700, 割り勘=blue-800)
            3. No Prisma schema changes unless explicit in Issue
            4. No obvious bugs or missing edge cases
            5. Code quality: types, no `any`, proper error handling

            Then post ONE PR comment starting with EXACTLY one of:

            `## AI Review: APPROVE`
            <one-sentence summary>

            or

            `## AI Review: CHANGES (iteration ${{ needs.guard.outputs.iter_count }}/3)`
            - <bullet list of specific gaps>

            @claude Please address the above feedback.

            Be strict. Only APPROVE if you would merge this yourself.
            If APPROVE, additionally run `gh pr merge ${{ github.event.pull_request.number }} --auto --squash` to enable auto-merge.
