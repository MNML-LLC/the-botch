name: LINE 週次未払い通知

on:
  schedule:
    # 毎週月曜 00:00 UTC = 09:00 JST
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call notify-unpaid API
        env:
          APP_URL: ${{ secrets.APP_URL }}
          NOTIFY_API_TOKEN: ${{ secrets.NOTIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${NOTIFY_API_TOKEN:-}" ]; then
            echo "::error::APP_URL または NOTIFY_API_TOKEN が未設定です"
            exit 1
          fi
          echo "POST ${APP_URL}/api/line/notify-unpaid"
          curl -fsS --max-time 60 \
            -X POST "${APP_URL}/api/line/notify-unpaid" \
            -H "Authorization: Bearer ${NOTIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n"
