name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # secrets コンテキストは job-level の `if:` 条件では参照できない（GitHub Actions の
  # 仕様）。そのため gate ジョブで secret の存在をチェックし、outputs 経由で
  # 後続の e2e ジョブに伝える方式を採る。
  gate:
    runs-on: ubuntu-latest
    outputs:
      has-secret: ${{ steps.check.outputs.has-secret }}
    steps:
      - id: check
        env:
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: |
          if [ -n "$E2E_DATABASE_URL" ]; then
            echo "has-secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::secrets.E2E_DATABASE_URL is not set — skipping E2E job. Add a Neon Test Branch connection string to enable E2E."
          fi

  e2e:
    needs: [gate]
    # E2E_DATABASE_URL (Neon Test Branch) が未設定の場合はジョブをスキップする。
    # 本番 DATABASE_URL へのフォールバックは行わない（E2E が create/delete を大量に
    # 実行するため、本番データを破壊するリスクを避ける）。
    if: needs.gate.outputs.has-secret == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: the-botch
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_BASE_URL: http://localhost:3000
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: the-botch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Apply Prisma migrations to test DB
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npx prisma db seed

      - name: Build Next.js
        run: npm run build

      - name: Start Next.js server
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server to be ready
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:3000 > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Next.js server did not start within 60s"
          exit 1

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: the-botch/playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: the-botch/test-results/
          retention-days: 14
